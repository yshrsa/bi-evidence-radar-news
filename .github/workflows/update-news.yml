name: Update BI Evidence Radar

on:
  schedule:
    - cron: "15 21 * * *" # 06:15 JST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bi-evidence-radar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Collect, summarize and publish
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            python -m src.run_pipeline --summary-limit 12
          else
            echo "Cloudflare AI secrets are not configured; collecting without paid fallback."
            python -m src.run_pipeline --skip-summarize
          fi
      - name: Sync publishable records to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          if [[ -n "$NOTION_API_KEY" && -n "$NOTION_DATABASE_ID" ]]; then
            python -m src.sync_notion
          else
            echo "Notion secrets are not configured; skipping corpus sync."
          fi
      - name: Commit data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "data: refresh evidence feed"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
